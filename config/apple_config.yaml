paths:
  output_dir: output

  raster:
    # 默认预测栅格（苹果）。作物相关路径在 tools.py 中动态计算为 {crop}_suitability.tif
    china_suitability_tf: output/predictions/china_suitability.tif

  shapefile:
    province: data/shapfile/china_province.shp
    city: data/shapfile/china_city.shp
    county: data/shapfile/china_county.shp

  output:
    region_map: output/predictions/region_map.png

    suitability_map_path: output/static/suitability_map.png
    ranking_table_path: output/static/ranking_table.png
    score_range_chart_path: output/static/range_chart.png

    first_stage_json: output/cache/pipeline/data_layer_1.json
    second_stage_json: output/cache/pipeline/data_layer_2.json
    final_stage_html: output/reports/final_report.html

    semantic_layer: output/cache/pipeline/semantic_layer.json

  # 模板选择: "report.html" (标准) | "report_dashboard.html" (仪表盘)
  html_template: report.html

prompts:
  # Agent 系统提示（供 conversation.py 使用）
  data_layer: prompts/system/data_layer.txt
