paths:
  output_dir: output

  raster:
    china_suitability_tf: output/train_output/china_suitability.tif

  shapefile:
    province: data/shapfile/china_province.shp
    city: data/shapfile/china_city.shp
    county: data/shapfile/china_county.shp

  output:
    region_map: output/train_output/region_map.png

    suitability_map_path: output/static/suitability_map.png
    ranking_table_path: output/static/ranking_table.png
    score_range_chart_path: output/static/range_chart.png

    first_stage_json: output/first_stage_output.json
    second_stage_json: output/second_stage_output.json
    final_stage_html: output/final_stage_report.html

    semantic_layer: output/cache/semantic_layer.json

  # 报告模板选择
  #   "report.html"           — 标准详细报告（默认），白底蓝调，适合打印/正式汇报
  #   "report_dashboard.html" — 仪表盘风格，暗色背景，适合屏幕展示/快速浏览
  # 也可在代码中通过 generate_data_report(context, template="dashboard") 动态选择
  html_template: report.html

prompts:
  data_layer: prompts/system/data_layer.txt
  analysis_layer: prompts/system/analyze.txt

  summary_prompt: prompts/sections/summary_prompt.txt
  overall_analysis_prompt: prompts/sections/overall_analysis_prompt.txt
  spatial_analysis_prompt: prompts/sections/spatial_analysis_prompt.txt
  top_regions_analysis_prompt: prompts/sections/top_regions_analysis_prompt.txt
  risk_analysis_prompt: prompts/sections/risk_analysis_prompt.txt
  stability_analysis_prompt: prompts/sections/stability_analysis_prompt.txt
  industry_advice_prompt: prompts/sections/industry_advice_prompt.txt
  conclusion_prompt: prompts/sections/conclusion_prompt.txt